<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Classic FM 播放器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#f5f5f5;min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:18px}
.player{width:100%;max-width:520px;background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:24px 22px;
backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.brand{text-align:center;margin-bottom:18px}
.brand h1{font-size:25px;font-weight:700;letter-spacing:2px;
background:linear-gradient(90deg,#e8c77a,#f6e7b8,#e8c77a);-webkit-background-clip:text;
-webkit-text-fill-color:transparent;background-clip:text}
.brand p{font-size:12px;color:#b8c4cc;margin-top:6px}
.sechead{font-size:11px;color:#7d8b95;letter-spacing:1px;margin-bottom:8px}
.tabs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:16px}
.tab{padding:9px 13px;border:1px solid rgba(255,255,255,.15);border-radius:20px;
background:rgba(255,255,255,.05);color:#dfe6ea;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.12)}
.tab.active{border-color:#e8c77a;background:rgba(232,199,122,.15);color:#f6e7b8;font-weight:600}
.quality{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
.quality .lbl{font-size:11px;color:#7d8b95}
.qbtn{padding:5px 14px;border:1px solid rgba(255,255,255,.15);border-radius:14px;
background:rgba(255,255,255,.05);color:#cfd8de;font-size:12px;cursor:pointer;transition:.2s}
.qbtn.on{border-color:#7ee0a8;background:rgba(126,224,168,.12);color:#7ee0a8;font-weight:600}
.qbtn:disabled{opacity:.35;cursor:not-allowed}
.track{display:flex;align-items:center;gap:15px;padding:16px;background:rgba(0,0,0,.25);
border-radius:14px;margin-bottom:14px;min-height:88px}
.cover{width:60px;height:60px;border-radius:10px;background:rgba(255,255,255,.08) center/cover;
flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.info{flex:1;min-width:0}
.info .lbl{font-size:10px;color:#93a4af;letter-spacing:2px;margin-bottom:6px}
.info .title{font-size:16px;font-weight:600;color:#f6e7b8;line-height:1.35;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .artist{font-size:13px;color:#cfd8de;margin-top:4px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent{margin-bottom:16px}
.recent .h{font-size:11px;color:#7d8b95;letter-spacing:1px;margin-bottom:8px}
.recent .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;
padding:5px 0;color:#b8c4cc;border-bottom:1px solid rgba(255,255,255,.05)}
.recent .row span:last-child{color:#8fa0aa;text-align:right;flex-shrink:0}
.controls{display:flex;align-items:center;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:12px;
background:linear-gradient(90deg,#e8c77a,#f6e7b8);color:#1a2a33;font-size:15px;font-weight:700;cursor:pointer}
.btn:active{opacity:.85}
.btn.alt{flex:0 0 auto;padding:13px 13px;background:rgba(255,255,255,.12);color:#e8c77a;
border:1px solid rgba(232,199,122,.4);font-size:13px;font-weight:600}
.vol{display:flex;align-items:center;gap:6px;color:#93a4af;font-size:12px}
.vol input{width:64px;accent-color:#e8c77a}
.st{font-size:11px;color:#7ee0a8;text-align:center;margin-top:10px;min-height:16px;line-height:1.5}
.tip{font-size:11px;color:#7d8b95;text-align:center;margin-top:10px;line-height:1.7}
audio{display:none}
</style>
</head>
<body>
<div class="player">
  <div class="brand"><h1>CLASSIC FM</h1><p>频道切换 · 实时曲目 · 多线备份</p></div>

  <div class="sechead">选择频道</div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-id="main">主频道</div>
    <div class="tab" data-id="calm">Calm</div>
    <div class="tab" data-id="movies">Movies</div>
    <div class="tab" data-id="essential">精选</div>
    <div class="tab" data-id="hof">名人堂</div>
  </div>

  <div class="quality">
    <span class="lbl">线路</span>
    <button class="qbtn on" id="qAuto">自动</button>
    <button class="qbtn" id="qFixed">单线</button>
    <span class="lbl" id="qNote">自动=失败才换线</span>
  </div>

  <div class="track">
    <div class="cover" id="cover">♪</div>
    <div class="info">
      <div class="lbl">正在播放 NOW PLAYING</div>
      <div class="title" id="title">曲目连接中…</div>
      <div class="artist" id="artist"></div>
    </div>
  </div>

  <div class="recent" id="recent"></div>

  <div class="controls">
    <button class="btn" id="toggle">播放</button>
    <button class="btn alt" id="switchLine">换线</button>
    <div class="vol"><input type="range" id="vol" min="0" max="1" step="0.05" value="0.8"></div>
  </div>
  <div class="st" id="st"></div>
  <div class="tip">自动模式仅在播放失败时换线，不会反复跳 · 偶尔缓冲属正常，等它自己恢复 · 换线可手动点</div>
</div>

<audio id="audio" preload="none"></audio>
<script>
/* 所有节点均实测可用。同流不同机房做备份，每个频道配4条。 */
var STATIONS={
  main:{name:'主频道',service:'121',nodes:[
    'https://media-sov.musicradio.com/ClassicFMMP3',
    'https://ice-sov.musicradio.com/ClassicFMMP3',
    'https://media-ssl.musicradio.com/ClassicFMMP3',
    'https://media-ice.musicradio.com/ClassicFMMP3'
  ]},
  calm:{name:'Calm',service:'',nodes:[
    'https://media-sov.musicradio.com/ClassicFMCalmMP3',
    'https://media-ice.musicradio.com/ClassicFMCalmMP3',
    'https://ice-sov.musicradio.com/ClassicFMCalmMP3',
    'https://media-ssl.musicradio.com/ClassicFMCalmMP3'
  ]},
  movies:{name:'Movies',service:'',nodes:[
    'https://media-sov.musicradio.com/ClassicFMMoviesMP3',
    'https://media-ice.musicradio.com/ClassicFMMoviesMP3',
    'https://ice-sov.musicradio.com/ClassicFMMoviesMP3',
    'https://media-ssl.musicradio.com/ClassicFMMoviesMP3'
  ]},
  essential:{name:'精选',service:'',nodes:[
    'https://media-sov.musicradio.com/ClassicFM-M-Essential',
    'https://media-ice.musicradio.com/ClassicFM-M-Essential',
    'https://ice-sov.musicradio.com/ClassicFM-M-Essential',
    'https://media-ssl.musicradio.com/ClassicFM-M-Essential'
  ]},
  hof:{name:'名人堂',service:'',nodes:[
    'https://media-sov.musicradio.com/ClassicFM-M-HOF',
    'https://media-ice.musicradio.com/ClassicFM-M-HOF',
    'https://ice-sov.musicradio.com/ClassicFM-M-HOF',
    'https://media-ssl.musicradio.com/ClassicFM-M-HOF'
  ]}
};
var cur='main',autoMode=true,nodeIdx=0,audio=document.getElementById('audio'),
    wantPlay=false,switching=false,lastSwitch=0,playingOk=false;
var $=function(id){return document.getElementById(id)};

function nodes(){return STATIONS[cur].nodes}
function nameNow(){return STATIONS[cur].name+(autoMode?'':'·单线')}
function status(t,c){$('st').textContent=t;$('st').style.color=c||'#7ee0a8'}

function playNode(){
  var ns=nodes();
  if(nodeIdx>=ns.length)nodeIdx=0;
  var url=ns[nodeIdx];
  switching=false;playingOk=false;
  status('连接中… '+nameNow()+' 线路'+(nodeIdx+1)+'/'+ns.length,'#e8c77a');
  try{audio.pause()}catch(e){}
  audio.src=url;
  audio.load();
  var p;try{p=audio.play()}catch(e){p=Promise.reject(e)}
  if(p&&p.then){
    p.then(function(){
      wantPlay=true;$('toggle').textContent='暂停';playingOk=true;
      status('播放中 · '+nameNow()+' 线路'+(nodeIdx+1)+'/'+ns.length);
    }).catch(function(err){
      if(!wantPlay||switching)return;
      status('线路播放失败：'+(err&&err.name||'Error')+'，点「换线」重试','#ff9a8b');
    });
  }
}

/* 换线：只在明确失败或用户手动时调用，带冷却，绝不自动循环 */
function switchLine(auto){
  var ns=nodes();
  var now=Date.now();
  if(auto&&now-lastSwitch<15000)return;
  if(ns.length<2){if(auto){status('仅一条线路，无法自动换','#ff9a8b')}return}
  lastSwitch=now;
  nodeIdx=(nodeIdx+1)%ns.length;
  if(wantPlay){playNode()}
  else{status('已切到线路 '+(nodeIdx+1)+'/'+ns.length)}
}

function setStation(id){
  var was=wantPlay;cur=id;nodeIdx=0;lastSwitch=0;playingOk=false;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.id===id)});
  if(was){playNode()}else{
    try{audio.src=nodes()[0]}catch(e){}
    status('已选 '+nameNow());
  }
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){setStation(t.dataset.id)})
});

function setMode(auto){
  autoMode=auto;nodeIdx=0;lastSwitch=0;
  $('qAuto').classList.toggle('on',auto);
  $('qFixed').classList.toggle('on',!auto);
  $('qNote').textContent=auto?'自动=失败才换线':'固定单条线路';
  if(wantPlay){playNode()}else{status('已选 '+nameNow())}
}
$('qAuto').addEventListener('click',function(){setMode(true)});
$('qFixed').addEventListener('click',function(){setMode(false)});

/* ===== 曲目：Official Global Player WebSocket ===== */
var WS_URL='wss://metadata.musicradio.com/v2/now-playing';
var SERVICE='121';
var ws=null,reconnectTimer=null,reconnectDelay=2000,trackGot=false,lastTitle='';
function renderTrack(np){
  if(!np)return;
  var title=np.title||'';
  if(title&&title!==lastTitle){
    lastTitle=title;trackGot=true;
    $('title').textContent=title;
    $('artist').textContent=np.artist||'';
    var art=np.proxied_artwork||np.artwork||'';
    if(art){$('cover').style.backgroundImage='url('+art+')';$('cover').textContent=''}
    else{$('cover').style.backgroundImage='';$('cover').textContent='♪'}
  }
}
function renderRecent(list){
  if(!list||!list.length)return;
  var html='<div class="h">最近播放</div>';
  list.slice(0,4).forEach(function(x){
    html+='<div class="row"><span>'+(x.title||'')+'</span><span>'+(x.artist||'')+'</span></div>'
  });
  $('recent').innerHTML=html;
}
function connectWS(){
  try{ws=new WebSocket(WS_URL)}catch(e){scheduleReconnect();return}
  ws.onopen=function(){
    reconnectDelay=2000;
    ws.send(JSON.stringify({actions:[{type:'subscribe',service:SERVICE}]}));
  };
  ws.onmessage=function(ev){
    var d;try{d=JSON.parse(ev.data)}catch(e){return}
    if(!d||d.service!==SERVICE)return;
    renderTrack(d.now_playing);renderRecent(d.previously_played);
  };
  ws.onclose=function(){scheduleReconnect()};
}
function scheduleReconnect(){
  if(reconnectTimer)clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(function(){
    reconnectDelay=Math.min(reconnectDelay*1.5,30000);connectWS();
  },reconnectDelay);
  if(!trackGot)$('title').textContent='曲目连接中…';
}
connectWS();

$('toggle').addEventListener('click',function(){
  if(wantPlay){wantPlay=false;audio.pause();$('toggle').textContent='播放';status('已暂停')}
  else{wantPlay=true;lastSwitch=0;$('toggle').textContent='暂停';playNode()}
});
$('switchLine').addEventListener('click',function(){switchLine(false)});

/* 只有明确的加载错误才自动换一次线，有冷却，不循环 */
audio.addEventListener('error',function(){
  if(!wantPlay)return;
  status('线路失败，自动换线…','#ff9a8b');
  switchLine(true);
});
audio.addEventListener('playing',function(){
  wantPlay=true;playingOk=true;$('toggle').textContent='暂停';
});
audio.addEventListener('pause',function(){
  if(!wantPlay)$('toggle').textContent='播放';
});
/* 缓冲/等待只提示，不换线，让它自己恢复 */
audio.addEventListener('waiting',function(){
  if(wantPlay)status('缓冲中，请稍候…','#e8c77a');
});
audio.addEventListener('stalled',function(){
  if(wantPlay&&!playingOk)status('连接较慢，请稍候…','#e8c77a');
});
$('vol').addEventListener('input',function(){audio.volume=this.value});
audio.volume=0.8;
</script>
</body>
</html>
